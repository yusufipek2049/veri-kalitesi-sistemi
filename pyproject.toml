[project]
name = "veri-kalitesi-sistemi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.135.3",
    "packaging==26.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pydantic==2.12.5",
    "SQLAlchemy==2.0.51",
    "starlette==1.0.0",
    "tomli==2.4.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["03-Backend/src", "06-Testler/support"]
testpaths = ["06-Testler"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
