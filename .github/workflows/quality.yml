# Kalite kapıları — her push ve pull request'te çalışır.
#
# Geçiş kuralı:
#   - backend-test, integration, backend-lint, backend-types ve frontend
#     ZORUNLUdur; başarısız olursa iş akışı kırmızıdır.
#   - integration işi PostgreSQL servis konteyneriyle çalışır, yalnız
#     06-Testler/02-Entegrasyon dizinini koşar ve pytest çıktısında
#     skipped=0 olduğunu zorlar (skip varsa iş başarısız olur).
#
# Bağımlılık kurulumu: pyproject.toml'da [build-system] tanımlı değildir ve
# paket standart dışı konumdadır (03-Backend/src). Bu nedenle `pip install .`
# kullanılamaz; bağımlılıklar pyproject.toml'dan okunup doğrudan kurulur.

name: Kalite Kapıları

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: "Backend testleri (pytest) — ZORUNLU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install tomli
          pip install $(python -c "import tomli; print(' '.join(tomli.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          pip install pytest==9.0.3
      - name: pytest çalıştır
        run: pytest -q

  integration:
    name: "PostgreSQL entegrasyon (skipped=0) — ZORUNLU"
    runs-on: ubuntu-latest
    # PostgreSQL servis konteyneri. Veritabanı adı ürün gereği data_quality
    # olmalıdır (DatabaseSettings.from_url aksi halde DatabaseConfigurationError
    # fırlatır). İmaj, yerel dq-postgres-test konteyneriyle aynıdır (16-alpine).
    # Şema önceden var olmak zorunda değildir: alembic migration'ları boş
    # veritabanından şemayı kurar (test_migration_from_empty_schema_reaches_head).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dqtest
          POSTGRES_PASSWORD: dqtest
          POSTGRES_DB: data_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 90 entegrasyon testi bu iki değişkenle etkinleşir.
      DATA_QUALITY_POSTGRES_TEST_URL: postgresql+psycopg://dqtest:dqtest@127.0.0.1:5432/data_quality
      DATA_QUALITY_DATABASE_SCHEMA: data_quality
      # test_synthetic_postgresql_integration.py içindeki 2 test AYRICA
      # SYNTHETIC_POSTGRES_TEST=1 ve PG* değişkenleri gerektirir; bunlar olmadan
      # skipped=0 sağlanamaz (92 yerine 90 test koşar, 2 skip kalır).
      SYNTHETIC_POSTGRES_TEST: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: data_quality
      PGUSER: dqtest
      PGPASSWORD: dqtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install tomli
          pip install $(python -c "import tomli; print(' '.join(tomli.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          pip install pytest==9.0.3
      - name: pytest çalıştır (skipped=0 zorunlu)
        run: |
          set -o pipefail
          python -m pytest -q 06-Testler/02-Entegrasyon 2>&1 | tee pytest-integration.txt
          if grep -qE '[0-9]+ skipped' pytest-integration.txt; then
            echo "::error::Entegrasyon işinde skip edilen test var (skipped != 0). PostgreSQL servis veya env değişkenleri eksik olabilir."
            exit 1
          fi

  backend-lint:
    name: "Backend lint (ruff) — ZORUNLU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ruff kur
        run: python -m pip install ruff==0.15.13
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .

  backend-types:
    name: "Backend tipler (mypy) — ZORUNLU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install tomli
          pip install $(python -c "import tomli; print(' '.join(tomli.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          pip install mypy==2.1.0
      - name: mypy çalıştır
        run: mypy 03-Backend/src

  frontend:
    name: "Frontend (test + typecheck + build) — ZORUNLU"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-Frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 04-Frontend/app/package-lock.json
      - name: Bağımlılıkları kur (npm ci)
        run: npm ci
      - name: Test çalıştır (vitest)
        run: npm test
      - name: Tip denetimi (tsc)
        run: npm run typecheck
      - name: Üretim derlemesi (vite build)
        run: npm run build
