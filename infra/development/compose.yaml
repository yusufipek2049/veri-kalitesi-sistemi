services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/development/postgres/Dockerfile
    environment:
      POSTGRES_DB: data_quality
      POSTGRES_USER: dq_app
      POSTGRES_PASSWORD: ${DQ_POSTGRES_PASSWORD:?set DQ_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq_app -d data_quality"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "15432:5432"
    volumes:
      - dq-postgres:/var/lib/postgresql/data
      - dq-postgres-tls:/run/postgres-tls
      - ./runtime-secrets/data-sources:/run/secrets/data-sources:ro

  migrate:
    build:
      context: ../..
      dockerfile: infra/application/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-environment
      DATA_QUALITY_DATABASE_URL: postgresql+psycopg://dq_app:${DQ_POSTGRES_PASSWORD}@postgres:5432/data_quality
      DATA_QUALITY_DATABASE_SCHEMA: dq
      DATA_QUALITY_RUNTIME_ENVIRONMENT: development
      DATA_QUALITY_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      DATA_QUALITY_ACTOR_POLICY_VERSION: DEVELOPMENT_DASHBOARD_POLICY_V1
      DATA_QUALITY_LOCAL_SECRET_DIR: /run/secrets/data-sources
      DQ_EVIDENCE_STORAGE_ROOT: /tmp/issue-evidence

  seed:
    build:
      context: ../..
      dockerfile: infra/application/Dockerfile
    command: ["python", "scripts/seed_database.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
    volumes:
      - ./runtime-secrets/data-sources:/run/secrets/data-sources:ro
      - dq-postgres-tls:/run/postgres-tls:ro

  api:
    build:
      context: ../..
      dockerfile: infra/application/Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *api-environment
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./runtime-secrets/data-sources:/run/secrets/data-sources:ro
      - dq-postgres-tls:/run/postgres-tls:ro

  worker:
    build:
      context: ../..
      dockerfile: infra/application/Dockerfile
    command: ["dq-worker"]
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *api-environment
      DQ_WORKER_ID: worker-dev-01
      DQ_WORKER_HOSTNAME: worker-dev-01
      DQ_WORKER_CAPACITY: "1"
      DQ_WORKER_HEALTH_MAX_AGE_SECONDS: "90"
    healthcheck:
      test: ["CMD", "python", "-m", "veri_kalitesi.jobs.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./runtime-secrets/data-sources:/run/secrets/data-sources:ro
      - dq-postgres-tls:/run/postgres-tls:ro

  frontend:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: infra/development/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

volumes:
  dq-postgres:
  dq-postgres-tls:
